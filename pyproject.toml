[project]
name = "simulator"
version = "0.2.0"
description = ""
authors = [
    {name = "GuilhermeCF",email = "guicostaferreira.2003@gmail.com"}
]
license = "AGPL-3.0-or-later"
readme = "README.md"
# 3.14.1 is excluded: networkx refuses that one broken CPython patch.
requires-python = ">=3.13, <3.15, !=3.14.1"
dependencies = [
    "numpy (>=2.3.5,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "ruamel-yaml (>=0.19.1,<0.20.0)",
    "h5py (>=3.16.0,<4.0.0)",
    "tqdm (>=4.68.4,<5.0.0)",
    "networkx (>=3.6.1,<4.0.0)",
    "plotly (>=6.9.0,<7.0.0)"
]

[tool.poetry]
packages = [{include = "simulator", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pylint (>=4.0.6,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "coverage (>=7.15.0,<8.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "docformatter (>=1.7.8,<2.0.0)",
    "classpy @ git+https://github.com/GuilhermeCosta-Ferreira/ClassyPython.git",
    "ruff (>=0.16.1,<0.17.0)"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]

markers = [
    "unit: fast isolated tests",
    "integration: tests involving multiple modules or adapters",
    "e2e: end-to-end pipeline tests",
    "slow: tests that take noticeable time",
    "regression: tests for previously fixed bugs",
    "requires_data: tests that require external/local datasets",
]
